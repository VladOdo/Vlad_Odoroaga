<!DOCTYPE html>
<html>

<head>
    <title>Exercitiul 2</title>
</head>

<body>
    <h1>Exercitiul 2</h1>
    <p>Rezolvarea este in consola.</p>

    <script>
        var tranzactie1 = true;
        var tranzactie2 = false;
        console.log("--- Verificare tranzactie1 ---");
        if (tranzactie1) {
            console.log("Tranzactie acceptata!");
        }
        console.log("\n--- Verificare tranzactie2 ---");
        if (tranzactie2) {
            console.log("Tranzactie acceptată!");
        } else {
            console.log("Tranzactie refuzată!");
        }
        //Prima tranzacție, fiind adevărată (true), este acceptată, iar a doua, fiind falsă (false), este refuzată și trece pe ramura else
    </script>
</body>

</html>
