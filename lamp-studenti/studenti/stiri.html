<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <title>Știri - Rapid FanClub</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/authentication.js"></script>
</head>

<body>

    <div class="grid-container">
        <header>
            <a id="brand" href="index.html">Rapid FanClub</a>
            <div class="user-actions">
                <!-- Se vede doar dacă ești logat ca Admin -->
                <a id="logout-button-header" href="#" class="logout-btn hidden">Ieșire Admin</a>
            </div>
        </header>

        <nav>
            <a href="index.html">Acasă</a>
            <a href="stiri.html">Știri</a>
            <a href="echipa.html">Echipă</a>
            <a href="program_competitional.html">Program</a>
        </nav>

        <main>
            <h2>Ultimele Știri</h2>
            <!-- Acest DIV este gol momentan. -->
            <!-- Scriptul 'js/stiri.js' va citi baza de date și va crea cardurile cu știri AICI, în interior. -->
            <div id="stiri-container">
                <p>Se încarcă știrile...</p>
            </div>
        </main>

        <aside>
            <h3>Info Club</h3>
            <p>Urmărește cele mai noi informatii despre Rapid București.</p>
        </aside>

        <footer>
            <div class="footer-container">
                <div id="footer-info">
                    <h2>Contact</h2>
                    <p>
                        Ne poți scrie direct la adresa:
                        <a href="mailto:contact@rapid-fansite.ro">contact@rapid-fansite.ro</a>
                    </p>
                </div>
                <div id="footer-form-container">
                    <!-- ID-ul 'footer-form' este folosit de 'js/contact.js' pentru a trimite datele -->
                    <form id="footer-form">
                        <div>
                            <label for="footer-nume">Numele tău:</label>
                            <input type="text" id="footer-nume" name="nume" placeholder="Ex: Ion Popescu" required>
                        </div>
                        <div>
                            <label for="footer-email">Email:</label>
                            <input type="email" id="footer-email" name="email" placeholder="Ex: ion@email.com" required>
                        </div>
                        <div>
                            <label for="footer-mesaj">Mesajul tău:</label>
                            <textarea id="footer-mesaj" name="mesaj" rows="3" placeholder="Scrie mesajul aici..."
                                required></textarea>
                        </div>
                        <button type="submit">Trimite Mesajul</button>
                    </form>
                </div>
            </div>
        </footer>
    </div>

    <script src="js/main.js" defer></script>
    <script src="js/stiri.js" defer></script>
    <script src="js/contact.js" defer></script>
</body>
</html>
