<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <title>Login - Rapid FanClub</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/authentication.js"></script>
</head>

<!-- Folosim clasa 'login-body' pentru a centra tot conținutul pe mijlocul ecranului -->
<body class="login-body">

    <div class="login-container">
        <h1>Login - Rapid FanClub</h1>

        <form id="login-form">
            <div>
                <label for="username">Utilizator:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div>
                <label for="password">Parolă:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Autentificare</button>

            <!-- Un paragraf gol momentan, folosit pentru a afișa erori (ex: "Parolă greșită") -->
            <!-- Clasa 'error-hidden' îl ține ascuns până când avem nevoie de el -->
            <p id="login-error-message" class="error-hidden"></p>
        </form>
    </div>

    <script src="js/login.js" defer></script>
</body>

</html>
