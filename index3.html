<body>
    <h1>Exercitiul 3</h1>
    <p>Rezolvarea este in consola.</p>

    <script>
        var num = [1, 16, 22, 3, 21, 26];
        console.log("Numerele inițiale: " + num.join(", "));
        num.sort(function (a, b) {
            return b - a;
        });
        console.log("Numerele sortate descrescător:");
        console.log(num.join(", "));
    </script>
</body>
